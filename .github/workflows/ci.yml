name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (includes dev)
        run: npm ci

      - name: Verify ESM guardrails
        run: npm run verify:esm

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Repository sanity
        run: |
          echo "CI placeholder for agentic-squad-framework"
