name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@9.12.3 --activate

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Verify pnpm
        run: |
          pnpm --version

      - name: Install dependencies (includes dev)
        run: pnpm install --frozen-lockfile

      - name: Run typecheck and verify:esm
        run: make verify-fast
        env:
          CI: "true"

      - name: Run tests with coverage
        run: make test-coverage
        env:
          CI: "true"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
          retention-days: 30

      - name: Run verify-plan-e2e (pull requests)
        if: github.event_name == 'pull_request'
        run: make verify-plan-e2e GOAL="CI verification" CONTEXT="pull request check"
        env:
          CI: "true"

  version-bump:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure package version is bumped
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git switch -C "${GITHUB_HEAD_REF}"
          git fetch origin "${{ github.event.pull_request.base.ref }}":"refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          MAIN_VERSION=$(git show "origin/${{ github.event.pull_request.base.ref }}:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          CURRENT_VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          echo "Main version: $MAIN_VERSION"
          echo "Current version: $CURRENT_VERSION"
          if [ "$MAIN_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Package version already changed in the PR; skipping auto bump."
            exit 0
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping version to $NEW_VERSION"
          node -e 'const fs=require("fs");const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));pkg.version=process.argv[1];fs.writeFileSync("package.json",JSON.stringify(pkg,null,2)+"\n","utf8");' "$NEW_VERSION"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add package.json
          git commit -m "ci: bump package version to $NEW_VERSION"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Fail if package.json version is unchanged
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}":"refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          BASE_VERSION=$(git show "origin/${{ github.event.pull_request.base.ref }}:package.json" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version));")
          HEAD_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "Base version: $BASE_VERSION"
          echo "Head version: $HEAD_VERSION"
          if [ "$HEAD_VERSION" = "$BASE_VERSION" ]; then
            echo "Version bump required: package.json version must change in this PR."
            exit 1
          fi
